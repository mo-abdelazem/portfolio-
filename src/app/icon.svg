<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B7FF72"/>
      <stop offset="100%" stop-color="#76e54c"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c100e"/>
      <stop offset="100%" stop-color="#050706"/>
    </linearGradient>
  </defs>
  
  <!-- Outer Obsidian Background Frame -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)"/>
  <rect width="30" height="30" x="1" y="1" rx="7" fill="none" stroke="url(#cyberGlow)" stroke-width="1.5" stroke-opacity="0.85"/>
  
  <!-- Cyber Brackets -->
  <path d="M 7.5 9.5 L 5.5 9.5 L 5.5 22.5 L 7.5 22.5" fill="none" stroke="#B7FF72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75"/>
  <path d="M 24.5 9.5 L 26.5 9.5 L 26.5 22.5 L 24.5 22.5" fill="none" stroke="#B7FF72" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.75"/>
  
  <!-- Monogram MA -->
  <text x="16" y="20.5" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="11.5" font-weight="900" letter-spacing="-0.3" fill="#FFFFFF">MA</text>
</svg>
